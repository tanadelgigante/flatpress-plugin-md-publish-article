name: CI

env:
  TESTBED_IMAGE: "${{ vars.IMAGE_NAME }}"
  TESTBED_LAN_RANGE: "${{ vars.LAN_RANGE }}"
  TESTBED_MOUNT_DATA: "${{ vars.MOUNT_DATA }}"
  # Internal DNS resolvers; used by every runner job (writes /etc/resolv.conf)
  # and by the testbed container (via the --dns flags built in the testbed job).
  INTERNAL_DNS: "${{ vars.RUNNER_LAN_GATEWAY }}"

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: 'package: build the artifact only | release: publish a previously built artifact as v{version.ini without -SNAPSHOT}'
        required: true
        default: 'package'
      package_run_id:
        description: 'Run ID that built the plugin-package artifact (required when job=release)'
        required: false

permissions:
  contents: read

jobs:
  # ── Job 1: Syntax lint (php -l) on every PHP file ────────────────
  lint:
    runs-on: lab
    steps:
      - name: Configure internal DNS
        run: |
          set -euo pipefail
          resolvconf=/etc/resolv.conf
          if [ ! -w "$resolvconf" ] && [ ! -w /etc ]; then
            echo "::warning::/etc/resolv.conf is not writable; skipping DNS config"
            exit 0
          fi
          : > "$resolvconf"
          for ns in $INTERNAL_DNS; do
            printf 'nameserver %s\n' "$ns" >> "$resolvconf"
          done
          echo "Configured /etc/resolv.conf with resolvers: $INTERNAL_DNS"

      - name: Install tooling (Node, PHP, zip)
        run: |
          sed -i 's#^https://#http://#' /etc/apk/repositories
          apk add --no-cache ca-certificates nodejs npm php-cli php84-openssl php84-phar php84-mbstring php84-iconv zip
          sed -i 's#^http://#https://#' /etc/apk/repositories

      - name: Trust the Gitea CA
        env:
          DUNGEONCACERT: ${{ secrets.DUNGEONCACERT }}
        run: |
          set -euo pipefail
          if [ -n "$DUNGEONCACERT" ]; then
            printf '%s\n' "$DUNGEONCACERT" > /usr/local/share/ca-certificates/gitea-ca.crt
            update-ca-certificates
            echo "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
            git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi

      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          ERRORS=0
          while IFS= read -r f; do
            echo -n "Linting $f … "
            if php -l "$f" 2>&1 | grep -q "No syntax errors"; then
              echo "OK"
            else
              echo "FAIL"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find publisharticle -name '*.php')
          echo ""
          echo "Total errors: $ERRORS"
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

  # ── Job 2: PHPUnit unit tests ────────────────────────────────────
  test:
    runs-on: lab
    steps:
      - name: Configure internal DNS
        run: |
          set -euo pipefail
          resolvconf=/etc/resolv.conf
          if [ ! -w "$resolvconf" ] && [ ! -w /etc ]; then
            echo "::warning::/etc/resolv.conf is not writable; skipping DNS config"
            exit 0
          fi
          : > "$resolvconf"
          for ns in $INTERNAL_DNS; do
            printf 'nameserver %s\n' "$ns" >> "$resolvconf"
          done
          echo "Configured /etc/resolv.conf with resolvers: $INTERNAL_DNS"

      - name: Install tooling (Node, PHP, zip, curl)
        run: |
          sed -i 's#^https://#http://#' /etc/apk/repositories
          apk add --no-cache ca-certificates nodejs npm php-cli php84-openssl php84-phar php84-mbstring php84-iconv php84-dom php84-xml php84-xmlwriter php84-tokenizer php84-ctype php84-simplexml php84-curl curl zip
          sed -i 's#^http://#https://#' /etc/apk/repositories

      - name: Trust the Gitea CA
        env:
          DUNGEONCACERT: ${{ secrets.DUNGEONCACERT }}
        run: |
          set -euo pipefail
          if [ -n "$DUNGEONCACERT" ]; then
            printf '%s\n' "$DUNGEONCACERT" > /usr/local/share/ca-certificates/gitea-ca.crt
            update-ca-certificates
            echo "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
            git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi

      - uses: actions/checkout@v4

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer -o composer-setup.php
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm -f composer-setup.php
          composer --version

      - name: Install Composer dependencies
        working-directory: publisharticle
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        working-directory: publisharticle
        run: vendor/bin/phpunit --testdox

  # ── Job 3: Build installation package ────────────────────────────
  package:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'package'
    needs: [lint, test]
    runs-on: lab
    permissions:
      contents: read
      packages: write
    outputs:
      archive_name: ${{ steps.build.outputs.archive_name }}
    steps:
      - name: Configure internal DNS
        run: |
          set -euo pipefail
          resolvconf=/etc/resolv.conf
          if [ ! -w "$resolvconf" ] && [ ! -w /etc ]; then
            echo "::warning::/etc/resolv.conf is not writable; skipping DNS config"
            exit 0
          fi
          : > "$resolvconf"
          for ns in $INTERNAL_DNS; do
            printf 'nameserver %s\n' "$ns" >> "$resolvconf"
          done
          echo "Configured /etc/resolv.conf with resolvers: $INTERNAL_DNS"

      - name: Install tooling (Node, zip, git)
        run: |
          sed -i 's#^https://#http://#' /etc/apk/repositories
          apk add --no-cache ca-certificates nodejs npm zip git
          sed -i 's#^http://#https://#' /etc/apk/repositories

      - name: Trust the Gitea CA
        env:
          DUNGEONCACERT: ${{ secrets.DUNGEONCACERT }}
        run: |
          set -euo pipefail
          if [ -n "$DUNGEONCACERT" ]; then
            printf '%s\n' "$DUNGEONCACERT" > /usr/local/share/ca-certificates/gitea-ca.crt
            update-ca-certificates
            echo "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
            git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi

      - uses: actions/checkout@v4

      - name: Build installation archive
        id: build
        run: |
          PLUGIN_DIR="publisharticle"
          ARCHIVE_NAME="publisharticle-$(date +%Y%m%d-%H%M%S).zip"

          cp README.md LICENSE.md "$PLUGIN_DIR/"
          zip -r "$ARCHIVE_NAME" "$PLUGIN_DIR"

          # Store archive name for the upload step and as a job output
          echo "ARCHIVE=$ARCHIVE_NAME" >> "$GITHUB_ENV"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload package to Gitea Packages
        env:
          PKGTOKEN: ${{ secrets.DUNGEONPAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          PKG_NAME="publisharticle"
          PKG_VERSION="build-${{ github.run_id }}"
          curl -sS -X PUT \
            -H "Authorization: token ${PKGTOKEN}" \
            --upload-file "$ARCHIVE" \
            "${GITHUB_SERVER_URL}/api/packages/${OWNER}/generic/${PKG_NAME}/${PKG_VERSION}/${ARCHIVE}" \
            -o /dev/null -w "Package uploaded: HTTP %{http_code}\n"
          echo "UPLOADED_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"

  # ── Job 3.5: Spin up an ephemeral FlatPress testbed with the built plugin ──
  testbed:
    needs: [package]
    runs-on: lab
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure internal DNS
        run: |
          set -euo pipefail
          resolvconf=/etc/resolv.conf
          if [ ! -w "$resolvconf" ] && [ ! -w /etc ]; then
            echo "::warning::/etc/resolv.conf is not writable; skipping DNS config"
            exit 0
          fi
          : > "$resolvconf"
          for ns in $INTERNAL_DNS; do
            printf 'nameserver %s\n' "$ns" >> "$resolvconf"
          done
          echo "Configured /etc/resolv.conf with resolvers: $INTERNAL_DNS"

      - name: Install tooling (docker CLI, curl)
        run: |
          sed -i 's#^https://#http://#' /etc/apk/repositories
          apk add --no-cache ca-certificates docker-cli curl
          sed -i 's#^http://#https://#' /etc/apk/repositories

      - name: Trust the Gitea CA
        env:
          DUNGEONCACERT: ${{ secrets.DUNGEONCACERT }}
        run: |
          set -euo pipefail
          if [ -n "$DUNGEONCACERT" ]; then
            printf '%s\n' "$DUNGEONCACERT" > /usr/local/share/ca-certificates/gitea-ca.crt
            update-ca-certificates
          fi

      - name: Resolve plugin package URL
        id: resolve_plugin
        run: |
          OWNER="${{ github.repository_owner }}"
          PKG_NAME="publisharticle"
          PKG_VERSION="build-${{ github.run_id }}"
          ZIP="${{ needs.package.outputs.archive_name }}"
          PLUGIN_URL="${GITHUB_SERVER_URL}/api/packages/${OWNER}/generic/${PKG_NAME}/${PKG_VERSION}/${ZIP}"

          echo "plugin_url=${PLUGIN_URL}" >> "$GITHUB_OUTPUT"
          echo "Resolved plugin URL: ${PLUGIN_URL}"

      - name: Get runner hostname
        id: runner
        run: echo "hostname=$(hostname)" >> "$GITHUB_OUTPUT"

      - name: Start ephemeral FlatPress testbed
        env:
          PLUGIN_URL: ${{ steps.resolve_plugin.outputs.plugin_url }}
          PLUGIN_AUTH_HEADER: "Authorization: token ${{ secrets.DUNGEONPAT }}"
          FLATPRESS_URL: ${{ vars.FLATPRESS_STABLE_URL }}
          HOSTNAME: ${{ steps.runner.outputs.hostname }}
          HOSTS: ${{ vars.HOSTS }}
        run: |
          set -euo pipefail
          CONTAINER="flatpress-test-${{ github.run_id }}"

          CA_BUNDLE="/etc/ssl/certs/ca-certificates.crt"

          DNS_FLAGS=""
          for ns in $INTERNAL_DNS; do
            DNS_FLAGS="$DNS_FLAGS --dns $ns"
          done
          echo "Testbed DNS flags:${DNS_FLAGS}"

          ADD_HOST_FLAGS=""
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            set -- $entry
            ip=$1; fqdn=$2
            ADD_HOST_FLAGS="$ADD_HOST_FLAGS --add-host ${fqdn}:${ip}"
          done <<< "$HOSTS"
          echo "Testbed add-host flags:${ADD_HOST_FLAGS}"

          for i in 1 2 3 4 5; do
            if docker run --pull=always -d \
                 --tmpfs /var/www/html:size=512m \
                 --restart unless-stopped \
                 $DNS_FLAGS \
                 $ADD_HOST_FLAGS \
                 -v "$CA_BUNDLE:/etc/ssl/certs/ca-certificates.crt:ro" \
                 -v "$MOUNT_DATA:/var/www/html/fp-content/content/import-in" \
                 -e FLATPRESS_URL="$FLATPRESS_URL" \
                 -e PLUGIN_URL="$PLUGIN_URL" \
                 -e PLUGIN_AUTH_HEADER="$PLUGIN_AUTH_HEADER" \
                 -p "0.0.0.0::80" \
                 --name "$CONTAINER" \
                 "${{ env.TESTBED_IMAGE }}" 2>/tmp/docker_run_err; then

              sleep 3

              PORT=$(docker inspect "$CONTAINER" \
                --format '{{range $k, $v := .NetworkSettings.Ports}}{{if eq $k "80/tcp"}}{{(index $v 0).HostPort}}{{end}}{{end}}' 2>/dev/null)

              if [ -z "$PORT" ]; then
                echo "::warning::Container started but port mapping not ready (attempt $i)"
                echo "Container logs:"
                docker logs "$CONTAINER" 2>&1 | tail -20
                docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
                continue
              fi

              echo "Ambiente di collaudo: http://${HOSTNAME}:${PORT}/" \
                   | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0

            elif grep -q "port is already allocated" /tmp/docker_run_err 2>/dev/null; then
              echo "Port collision on attempt $i, retrying…"
              continue
            else
              cat /tmp/docker_run_err >&2
              exit 1
            fi
          done

          echo "::error::Could not start testbed container after 5 attempts" >&2
          exit 1

  # ── Job 4: Create Gitea Release ──────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'release')
    needs: [lint, test]
    runs-on: lab
    permissions:
      contents: write
      packages: write
    outputs:
      release_version: ${{ steps.resolve_version.outputs.version }}
    steps:
      - name: Configure internal DNS
        run: |
          set -euo pipefail
          resolvconf=/etc/resolv.conf
          if [ ! -w "$resolvconf" ] && [ ! -w /etc ]; then
            echo "::warning::/etc/resolv.conf is not writable; skipping DNS config"
            exit 0
          fi
          : > "$resolvconf"
          for ns in $INTERNAL_DNS; do
            printf 'nameserver %s\n' "$ns" >> "$resolvconf"
          done
          echo "Configured /etc/resolv.conf with resolvers: $INTERNAL_DNS"

      - name: Install tooling (Node, zip, git)
        run: |
          sed -i 's#^https://#http://#' /etc/apk/repositories
          apk add --no-cache ca-certificates nodejs npm zip git
          sed -i 's#^http://#https://#' /etc/apk/repositories

      - name: Trust the Gitea CA
        env:
          DUNGEONCACERT: ${{ secrets.DUNGEONCACERT }}
        run: |
          set -euo pipefail
          if [ -n "$DUNGEONCACERT" ]; then
            printf '%s\n' "$DUNGEONCACERT" > /usr/local/share/ca-certificates/gitea-ca.crt
            update-ca-certificates
            echo "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
            git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: resolve_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            RAW="$(tr -d '[:space:]' < version.ini)"
            VERSION="v${RAW%-SNAPSHOT}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Download build artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          PKGTOKEN: ${{ secrets.DUNGEONPAT }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.inputs.package_run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "::error::package_run_id is required" >&2
            exit 1
          fi
          VER="${{ steps.resolve_version.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          PKG_NAME="publisharticle"
          PKG_VERSION="build-${RUN_ID}"
          PKG_BASE="${GITHUB_SERVER_URL}/api/packages/${OWNER}/generic/${PKG_NAME}/${PKG_VERSION}"

          FILES=$(curl -sS -H "Authorization: token ${PKGTOKEN}" "${PKG_BASE}/-/files")
          ZIP_FILE=$(printf '%s' "$FILES" | grep -o '"name":"[^"]*\.zip"' | head -1 | cut -d'"' -f4)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No zip file found in package ${PKG_NAME}@${PKG_VERSION}" >&2
            echo "API response: $FILES" >&2
            exit 1
          fi

          mkdir -p release-assets
          curl -sS -H "Authorization: token ${PKGTOKEN}" \
            "${PKG_BASE}/${ZIP_FILE}" \
            -o "release-assets/publisharticle-${VER}.zip"
          echo "Downloaded: publisharticle-${VER}.zip from ${PKG_VERSION}"

          curl -sS -X DELETE \
            -H "Authorization: token ${PKGTOKEN}" \
            "${GITHUB_SERVER_URL}/api/packages/${OWNER}/generic/${PKG_NAME}/${PKG_VERSION}" \
            -o /dev/null -w "Deleted package ${PKG_VERSION}: HTTP %{http_code}\n" || \
            echo "Warning: could not delete package ${PKG_VERSION}"

      - name: Build installation archive
        if: github.event_name != 'workflow_dispatch'
        run: |
          PLUGIN_DIR="publisharticle"
          ARCHIVE_NAME="publisharticle-${GITHUB_REF_NAME}.zip"
          cp README.md LICENSE.md "$PLUGIN_DIR/"
          zip -r "$ARCHIVE_NAME" "$PLUGIN_DIR"
          mkdir -p release-assets
          cp "$ARCHIVE_NAME" release-assets/

      - name: List release assets
        if: github.event_name != 'workflow_dispatch'
        run: ls -l release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_version.outputs.version }}
          files: release-assets/*.zip
          generate_release_notes: true

      - name: Bump version to next SNAPSHOT
        run: |
          set -euo pipefail

          BRANCH="${{ github.event.repository.default_branch }}"
          if [ -z "$BRANCH" ]; then
            echo "::error::Cannot determine the repository default branch" >&2
            exit 1
          fi
          git fetch origin
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          CURRENT="$(tr -d '[:space:]' < version.ini)"
          BASE="${CURRENT%-SNAPSHOT}"
          MAJOR="${BASE%%.*}"; REST="${BASE#*.}"
          MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          NEXT="$(printf '%s.%s.%s-SNAPSHOT' "$MAJOR" "$MINOR" "$((PATCH + 1))")"
          printf '%s\n' "$NEXT" > version.ini
          echo "Bumped version.ini: $CURRENT -> $NEXT"

          git config user.name "CI bot"
          git config user.email "ci-bot@localhost"
          git add version.ini
          if git diff --cached --quiet; then
            echo "version.ini is already up to date ($NEXT); nothing to commit"
            exit 0
          fi
          git commit -m "Bump version to $NEXT after release $GITHUB_REF_NAME"
          git push origin "$BRANCH"