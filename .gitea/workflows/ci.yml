name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: 'package: build the artifact only | release: publish a previously built artifact as v{version.ini without -SNAPSHOT}'
        required: true
        default: 'package'
      package_run_id:
        description: 'Run ID that built the plugin-package artifact (required when job=release)'
        required: false

permissions:
  contents: read

jobs:
  # ── Job 1: Syntax lint (php -l) on every PHP file ────────────────
  lint:
    runs-on: lab
    steps:
      # Node is needed by the JS actions (checkout etc.). No container: the
      # actions run on the runner so they inherit its network/DNS, which can
      # resolve repo.kenshiro.lab.tana.
      - name: Install tooling (Node, PHP, zip)
        run: apk add --no-cache nodejs npm php-cli php84-openssl php84-phar php84-mbstring php84-iconv zip

      # Trust the Gitea CA so git over HTTPS verifies against the internal CA
      - name: Trust the Gitea CA
        env:
          DUNGEONCACERT: ${{ secrets.DUNGEONCACERT }}
        run: |
          set -euo pipefail
          if [ -n "$DUNGEONCACERT" ]; then
            apk add --no-cache ca-certificates
            printf '%s\n' "$DUNGEONCACERT" > /usr/local/share/ca-certificates/gitea-ca.crt
            update-ca-certificates
            echo "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
            git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi

      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          ERRORS=0
          while IFS= read -r f; do
            echo -n "Linting $f … "
            if php -l "$f" 2>&1 | grep -q "No syntax errors"; then
              echo "OK"
            else
              echo "FAIL"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find publisharticle -name '*.php')
          echo ""
          echo "Total errors: $ERRORS"
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

  # ── Job 2: PHPUnit unit tests ────────────────────────────────────
  test:
    runs-on: lab
    steps:
      - name: Install tooling (Node, PHP, zip, curl)
        run: apk add --no-cache nodejs npm php-cli php84-openssl php84-phar php84-mbstring php84-iconv php84-dom php84-xml php84-xmlwriter php84-tokenizer php84-ctype php84-simplexml php84-curl curl zip

      - name: Trust the Gitea CA
        env:
          DUNGEONCACERT: ${{ secrets.DUNGEONCACERT }}
        run: |
          set -euo pipefail
          if [ -n "$DUNGEONCACERT" ]; then
            apk add --no-cache ca-certificates
            printf '%s\n' "$DUNGEONCACERT" > /usr/local/share/ca-certificates/gitea-ca.crt
            update-ca-certificates
            echo "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
            git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi

      - uses: actions/checkout@v4

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer -o composer-setup.php
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm -f composer-setup.php
          composer --version

      - name: Install Composer dependencies
        working-directory: publisharticle
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        working-directory: publisharticle
        run: vendor/bin/phpunit --testdox

  # ── Job 3: Build installation package ────────────────────────────
  # Triggered by workflow_dispatch (manual "promote" from Gitea UI).
  # Uploads the zip to the Gitea Generic Package Registry for the release job to retrieve.
  package:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'package'
    needs: [lint, test]
    runs-on: lab
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install tooling (Node, zip, git)
        run: apk add --no-cache nodejs npm zip git

      - name: Trust the Gitea CA
        env:
          DUNGEONCACERT: ${{ secrets.DUNGEONCACERT }}
        run: |
          set -euo pipefail
          if [ -n "$DUNGEONCACERT" ]; then
            apk add --no-cache ca-certificates
            printf '%s\n' "$DUNGEONCACERT" > /usr/local/share/ca-certificates/gitea-ca.crt
            update-ca-certificates
            echo "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
            git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi

      - uses: actions/checkout@v4

      - name: Build installation archive
        run: |
          PLUGIN_DIR="publisharticle"
          ARCHIVE_NAME="publisharticle-$(date +%Y%m%d-%H%M%S).zip"

          cp README.md LICENSE.md "$PLUGIN_DIR/"
          zip -r "$ARCHIVE_NAME" "$PLUGIN_DIR"

          # Store archive name for the upload step
          echo "ARCHIVE=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      # Upload the zip to the Gitea Generic Package Registry
      # Uses a dedicated PAT (scope write:package) since the built-in job
      # token (GITEA_TOKEN) authenticates as the synthetic ActionsUser,
      # which Gitea does not grant Packages API access to.
      - name: Upload package to Gitea Packages
        env:
          PKGTOKEN: ${{ secrets.DUNGEONPAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          PKG_NAME="publisharticle"
          PKG_VERSION="build-${{ github.run_id }}"
          curl -sS -X PUT \
            -H "Authorization: token ${PKGTOKEN}" \
            --upload-file "$ARCHIVE" \
            "${GITHUB_SERVER_URL}/api/packages/${OWNER}/generic/${PKG_NAME}/${PKG_VERSION}/${ARCHIVE}" \
            -o /dev/null -w "Package uploaded: HTTP %{http_code}\n"
          echo "UPLOADED_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"

  # ── Job 3.5: Spin up an ephemeral FlatPress testbed with the built plugin ──
  # Runs after "package", using the artifact it just uploaded to the Gitea
  # Package Registry (same run, same package version "build-<run_id>").
  # NOTE: does NOT gate "release" — that job only needs [lint, test], so a
  # failure here never blocks a release.
  testbed:
    needs: [package]
    runs-on: lab
    permissions:
      contents: read
      packages: read
    steps:
      # docker-cli is needed to launch the testbed container and to run the
      # throwaway --network host container for LAN IP discovery. Requires
      # /var/run/docker.sock reachable from this runner's job containers on
      # all 4 hosts.
      - name: Install tooling (docker CLI, curl)
        run: apk add --no-cache docker-cli curl

      - name: Trust the Gitea CA
        env:
          DUNGEONCACERT: ${{ secrets.DUNGEONCACERT }}
        run: |
          set -euo pipefail
          if [ -n "$DUNGEONCACERT" ]; then
            apk add --no-cache ca-certificates
            printf '%s\n' "$DUNGEONCACERT" > /usr/local/share/ca-certificates/gitea-ca.crt
            update-ca-certificates
          fi

      # Locate the zip the "package" job just uploaded
      - name: Resolve plugin package URL
        id: resolve_plugin
        env:
          PKGTOKEN: ${{ secrets.DUNGEONPAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          PKG_NAME="publisharticle"
          PKG_VERSION="build-${{ github.run_id }}"
          PKG_BASE="${GITHUB_SERVER_URL}/api/packages/${OWNER}/generic/${PKG_NAME}/${PKG_VERSION}"

          FILES=$(curl -sS -H "Authorization: token ${PKGTOKEN}" "${PKG_BASE}/-/files")
          ZIP_FILE=$(printf '%s' "$FILES" | grep -o '"name":"[^"]*\.zip"' | head -1 | cut -d'"' -f4)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No zip file found in package ${PKG_NAME}@${PKG_VERSION}" >&2
            echo "API response: $FILES" >&2
            exit 1
          fi

          echo "plugin_url=${PKG_BASE}/${ZIP_FILE}" >> "$GITHUB_OUTPUT"

      # Ask the host's real network stack (not the job container's bridge
      # interface) for the route to the LAN gateway, so we get the correct
      # LAN IP of whichever of the 4 hosts ran this job — even if multi-homed
      - name: Discover host LAN IP
        id: lan_ip
        run: |
          set -euo pipefail
          LAN_GATEWAY="${{ vars.RUNNER_LAN_GATEWAY }}"
          LAN_IP=$(docker run --rm --network host busybox \
            ip route get "$LAN_GATEWAY" | awk '{for(i=1;i<=NF;i++) if ($i=="src") print $(i+1)}')
          echo "lan_ip=$LAN_IP" >> "$GITHUB_OUTPUT"

      # Pick a free host port (with retry on the rare race), then launch the
      # ephemeral testbed. --rm + --tmpfs makes it fully ephemeral: no state
      # survives a docker stop
      - name: Start ephemeral FlatPress testbed
        env:
          PLUGIN_URL: ${{ steps.resolve_plugin.outputs.plugin_url }}
          PLUGIN_AUTH_HEADER: "Authorization: token ${{ secrets.DUNGEONPAT }}"
          FLATPRESS_URL: ${{ vars.FLATPRESS_STABLE_URL }}
          LAN_IP: ${{ steps.lan_ip.outputs.lan_ip }}
        run: |
          set -euo pipefail
          PORT_MIN=20000
          PORT_MAX=40000

          find_free_port() {
            local p
            p=$(( (RANDOM % (PORT_MAX - PORT_MIN + 1)) + PORT_MIN ))
            if ss -ltn | awk '{print $4}' | grep -q ":${p}\$"; then
              return 1
            fi
            echo "$p"
          }

          for i in 1 2 3; do
            PORT=$(find_free_port) || continue
            if docker run -d --rm \
                 --tmpfs /var/www/html:size=256m \
                 -e FLATPRESS_URL="$FLATPRESS_URL" \
                 -e PLUGIN_URL="$PLUGIN_URL" \
                 -e PLUGIN_AUTH_HEADER="$PLUGIN_AUTH_HEADER" \
                 -p "${LAN_IP}:${PORT}:80" \
                 --name "flatpress-test-${{ github.run_id }}" \
                 flatpress-testbed:latest 2>/tmp/docker_run_err; then
              echo "Ambiente di collaudo: http://${LAN_IP}:${PORT}/" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            elif grep -q "port is already allocated" /tmp/docker_run_err; then
              continue
            else
              cat /tmp/docker_run_err >&2
              exit 1
            fi
          done

          echo "::error::Could not find a free port after 3 attempts" >&2
          exit 1

  # ── Job 4: Create Gitea Release ──────────────────────────────────
  # Triggered by a push tag v*, or manually (job=release) to reuse a tested artifact
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'release')
    needs: [lint, test]
    runs-on: lab
    permissions:
      contents: write
      packages: write
    outputs:
      release_version: ${{ steps.resolve_version.outputs.version }}
    steps:
      - name: Install tooling (Node, zip, git)
        run: apk add --no-cache nodejs npm zip git

      - name: Trust the Gitea CA
        env:
          DUNGEONCACERT: ${{ secrets.DUNGEONCACERT }}
        run: |
          set -euo pipefail
          if [ -n "$DUNGEONCACERT" ]; then
            apk add --no-cache ca-certificates
            printf '%s\n' "$DUNGEONCACERT" > /usr/local/share/ca-certificates/gitea-ca.crt
            update-ca-certificates
            echo "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
            git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve the release version from version.ini (e.g. "0.0.1-SNAPSHOT" -> "v0.0.1")
      # For tag pushes, github.ref_name already is "v0.0.1"; for manual dispatch, derive it.
      - name: Resolve release version
        id: resolve_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            RAW="$(tr -d '[:space:]' < version.ini)"
            VERSION="v${RAW%-SNAPSHOT}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      # Manual release: retrieve the tested zip from the Gitea Package Registry
      - name: Download build artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          PKGTOKEN: ${{ secrets.DUNGEONPAT }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.inputs.package_run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "::error::package_run_id is required" >&2
            exit 1
          fi
          VER="${{ steps.resolve_version.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          PKG_NAME="publisharticle"
          PKG_VERSION="build-${RUN_ID}"
          PKG_BASE="${GITHUB_SERVER_URL}/api/packages/${OWNER}/generic/${PKG_NAME}/${PKG_VERSION}"

          # List files in the package version to find the zip filename
          FILES=$(curl -sS -H "Authorization: token ${PKGTOKEN}" "${PKG_BASE}/-/files")
          ZIP_FILE=$(printf '%s' "$FILES" | grep -o '"name":"[^"]*\.zip"' | head -1 | cut -d'"' -f4)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No zip file found in package ${PKG_NAME}@${PKG_VERSION}" >&2
            echo "API response: $FILES" >&2
            exit 1
          fi

          mkdir -p release-assets
          curl -sS -H "Authorization: token ${PKGTOKEN}" \
            "${PKG_BASE}/${ZIP_FILE}" \
            -o "release-assets/publisharticle-${VER}.zip"
          echo "Downloaded: publisharticle-${VER}.zip from ${PKG_VERSION}"

          # Clean up: delete the temporary package version
          curl -sS -X DELETE \
            -H "Authorization: token ${PKGTOKEN}" \
            "${GITHUB_SERVER_URL}/api/packages/${OWNER}/generic/${PKG_NAME}/${PKG_VERSION}" \
            -o /dev/null -w "Deleted package ${PKG_VERSION}: HTTP %{http_code}\n" || \
            echo "Warning: could not delete package ${PKG_VERSION}"

      # Tag release: build the archive from the source tree
      - name: Build installation archive
        if: github.event_name != 'workflow_dispatch'
        run: |
          PLUGIN_DIR="publisharticle"
          ARCHIVE_NAME="publisharticle-${GITHUB_REF_NAME}.zip"
          cp README.md LICENSE.md "$PLUGIN_DIR/"
          zip -r "$ARCHIVE_NAME" "$PLUGIN_DIR"
          mkdir -p release-assets
          cp "$ARCHIVE_NAME" release-assets/

      - name: List release assets
        if: github.event_name != 'workflow_dispatch'
        run: ls -l release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_version.outputs.version }}
          files: release-assets/*.zip
          generate_release_notes: true

      - name: Bump version to next SNAPSHOT
        run: |
          set -euo pipefail

          # The tag push leaves us on a detached HEAD: switch to the default branch
          BRANCH="${{ github.event.repository.default_branch }}"
          if [ -z "$BRANCH" ]; then
            echo "::error::Cannot determine the repository default branch" >&2
            exit 1
          fi
          git fetch origin
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          # Read current version, e.g. "0.0.1-SNAPSHOT"
          CURRENT="$(tr -d '[:space:]' < version.ini)"
          BASE="${CURRENT%-SNAPSHOT}"
          MAJOR="${BASE%%.*}"; REST="${BASE#*.}"
          MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          NEXT="$(printf '%s.%s.%s-SNAPSHOT' "$MAJOR" "$MINOR" "$((PATCH + 1))")"
          printf '%s\n' "$NEXT" > version.ini
          echo "Bumped version.ini: $CURRENT -> $NEXT"

          git config user.name "CI bot"
          git config user.email "ci-bot@localhost"
          git add version.ini
          if git diff --cached --quiet; then
            echo "version.ini is already up to date ($NEXT); nothing to commit"
            exit 0
          fi
          git commit -m "Bump version to $NEXT after release $GITHUB_REF_NAME"
          git push origin "$BRANCH"